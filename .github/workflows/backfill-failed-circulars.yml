name: Backfill Failed Circulars

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Optional source filter"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - nse
          - bse
          - sebi
      stage:
        description: "Failure stage filter"
        required: true
        default: both
        type: choice
        options:
          - both
          - claude_failed
          - ai_failed
      offset:
        description: "Start offset in failed-item list"
        required: false
        default: "0"
      batch_size:
        description: "Items to regenerate before each commit/push"
        required: false
        default: "25"

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Select failed circular IDs
        id: select
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ inputs.source }}"
          fi
          if [ "${{ inputs.stage }}" = "claude_failed" ]; then
            ARGS="$ARGS --stage claude_failed"
          elif [ "${{ inputs.stage }}" = "ai_failed" ]; then
            ARGS="$ARGS --stage ai_failed"
          else
            ARGS="$ARGS --stage claude_failed --stage ai_failed"
          fi

          SELECTED_IDS_RAW="$RUNNER_TEMP/backfill-selected-ids.raw.txt"
          SELECTED_IDS="$RUNNER_TEMP/backfill-selected-ids.txt"
          nix develop --command bash -lc "uv run scripts/backfill_failed.py list-ids $ARGS --offset '${{ inputs.offset }}' --verbose" > "$SELECTED_IDS_RAW"
          grep '^SKIP ' "$SELECTED_IDS_RAW" || true
          grep -v '^SKIP ' "$SELECTED_IDS_RAW" > "$SELECTED_IDS" || true
          count=$(wc -l < "$SELECTED_IDS" | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Selected $count IDs after cooldown filtering"
          echo "selected_ids=$SELECTED_IDS" >> "$GITHUB_OUTPUT"
          cat "$SELECTED_IDS"

      - name: Run backfill and commit in batches
        if: steps.select.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          BATCH_SIZE="${{ inputs.batch_size }}"
          if ! [[ "$BATCH_SIZE" =~ ^[0-9]+$ ]] || [ "$BATCH_SIZE" -lt 1 ]; then
            echo "Invalid batch_size: $BATCH_SIZE"
            exit 1
          fi

          if [ -n "${{ inputs.source }}" ]; then
            SOURCE_ARG="--source ${{ inputs.source }}"
          else
            SOURCE_ARG=""
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          mapfile -t IDS < "${{ steps.select.outputs.selected_ids }}"
          total="${#IDS[@]}"
          echo "Processing $total eligible failed items in batches of $BATCH_SIZE"

          batch_num=0
          for ((i=0; i<total; i+=BATCH_SIZE)); do
            batch_num=$((batch_num + 1))
            batch=("${IDS[@]:i:BATCH_SIZE}")
            echo "=== Batch $batch_num starting at index $i with ${#batch[@]} items ==="
            printf '%s\n' "${batch[@]}"

            BEFORE_HEAD=$(git rev-parse HEAD)
            BEFORE_SNAPSHOT=$(mktemp)
            git ls-files -s > "$BEFORE_SNAPSHOT"

            IDS_JOINED=$(printf '%q ' "${batch[@]}")
            BATCH_LOG="$RUNNER_TEMP/backfill-batch-$batch_num.log"
            nix develop --command bash -lc "cd scripts && uv run combined_pipeline.py regenerate $IDS_JOINED $SOURCE_ARG" | tee "$BATCH_LOG"

            SUCCESS_COUNT=$(grep -c '^✅ Regenerated ' "$BATCH_LOG" || true)
            FAILURE_COUNT=$(grep -c '^❌ Failed to regenerate ' "$BATCH_LOG" || true)
            echo "Batch $batch_num summary: successes=$SUCCESS_COUNT failures=$FAILURE_COUNT"

            if [ "$SUCCESS_COUNT" -eq 0 ]; then
              echo "Batch $batch_num had zero successful regenerations; reverting workspace changes"
              git reset --hard "$BEFORE_HEAD"
              git clean -fd
              continue
            fi

            AFTER_SNAPSHOT=$(mktemp)
            git ls-files -s > "$AFTER_SNAPSHOT"
            if diff "$BEFORE_SNAPSHOT" "$AFTER_SNAPSHOT" | grep -q '^<'; then
              echo "Batch $batch_num removed tracked files; reverting workspace changes for safety"
              git reset --hard "$BEFORE_HEAD"
              git clean -fd
              continue
            fi

            git add .
            if git diff --staged --quiet; then
              echo "No changes to commit for batch $batch_num"
            else
              git commit -m "fix(backfill): regenerate failed circulars batch $batch_num"
              git push
            fi
          done

      - name: No eligible items
        if: steps.select.outputs.count == '0'
        run: echo "No eligible failed circulars found after cooldown filtering"
