name: Backfill Failed Circulars

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Optional source filter"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - nse
          - bse
          - sebi
      stage:
        description: "Failure stage filter"
        required: true
        default: both
        type: choice
        options:
          - both
          - claude_failed
          - ai_failed
      offset:
        description: "Start offset in failed-item list"
        required: false
        default: "0"
      limit:
        description: "Max failed items to regenerate in this run"
        required: false
        default: "25"

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Select failed circular IDs
        id: select
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ inputs.source }}"
          fi
          if [ "${{ inputs.stage }}" = "claude_failed" ]; then
            ARGS="$ARGS --stage claude_failed"
          elif [ "${{ inputs.stage }}" = "ai_failed" ]; then
            ARGS="$ARGS --stage ai_failed"
          else
            ARGS="$ARGS --stage claude_failed --stage ai_failed"
          fi

          nix develop --command bash -lc "uv run scripts/backfill_failed.py list-ids $ARGS --offset '${{ inputs.offset }}' --limit '${{ inputs.limit }}' --verbose" > selected_ids.txt
          grep '^SKIP ' selected_ids.txt || true
          grep -v '^SKIP ' selected_ids.txt > selected_ids.filtered.txt || true
          mv selected_ids.filtered.txt selected_ids.txt
          count=$(wc -l < selected_ids.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Selected $count IDs after cooldown filtering"
          cat selected_ids.txt

      - name: Run backfill regenerate batch
        if: steps.select.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          IDS=$(tr '\n' ' ' < selected_ids.txt | xargs)
          if [ -z "$IDS" ]; then
            echo "No IDs selected"
            exit 0
          fi

          if [ -n "${{ inputs.source }}" ]; then
            SOURCE_ARG="--source ${{ inputs.source }}"
          else
            SOURCE_ARG=""
          fi

          nix develop --command bash -lc "cd scripts && uv run combined_pipeline.py regenerate $IDS $SOURCE_ARG"

      - name: Commit backfilled content
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Backfill failed circulars - $(date -u +"%Y-%m-%d %H:%M UTC")"
            git push
          fi
