name: Update Stock Market Circulars

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours
  workflow_dispatch:  # Manual trigger

jobs:
  update:
    name: Update ${{ matrix.source }} circulars
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [nse, bse, sebi, rbi, msei]
    concurrency:
      group: update-circulars-master-${{ matrix.source }}
      cancel-in-progress: false
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Queued runs must see content published by the preceding run.
        ref: master
        fetch-depth: 0

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v17

    - name: Setup Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@v8

    - name: Run pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      run: |
        nix develop --command just pipeline ${{ matrix.source }}

    - name: Commit updated content
      run: |
        set -euo pipefail
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        content_dir="hugo-site/content/circulars/${{ matrix.source }}"
        if [ ! -d "$content_dir" ]; then
          echo "No content directory for ${{ matrix.source }} yet"
          exit 0
        fi
        git add -- "$content_dir/"
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "Update ${{ matrix.source }} circulars - $(date -u +"%Y-%m-%d %H:%M UTC")"

        for attempt in 1 2 3 4 5; do
          echo "Push attempt $attempt"
          git fetch origin master
          git rebase origin/master
          if git push origin HEAD:master; then
            exit 0
          fi
        done

        echo "Failed to push after retries"
        exit 1
